[package]
name = "mabda-stdlib-consumer"
version = "0.1.0"
description = "Minimal example: use mabda as a Cyrius stdlib dep"
license = "GPL-3.0-only"
cyrius-version = "3.4.19"

[build]
src = "src/main.cyr"
output = "build/hello_gpu"

# This is what a consumer project looks like once Cyrius 3.4.19 ships with
# `[deps.mabda]` pointing at mabda v2.1.1. The consumer writes no FFI code —
# the bundled dist/mabda.cyr is symlinked in via `cyrius deps`.
#
# Staged in Cyrius 3.4.19, activated in 3.4.19. Until then, consumers use
# a path-based include (see src/main.cyr).
#
# [deps.mabda]
# git = "https://github.com/MacCracken/mabda.git"
# tag = "2.1.1"
# modules = ["dist/mabda.cyr"]

[deps.sakshi]
git = "https://github.com/MacCracken/sakshi.git"
tag = "0.9.0"
modules = ["sakshi.cyr"]
