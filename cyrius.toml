[package]
name = "mabda"
version = "2.1.2"
description = "mabda — GPU foundation layer for AGNOS"
license = "GPL-3.0-only"
repository = "https://github.com/MacCracken/mabda"
cyrius-version = "3.4.19"

[build]
src = "src/mabda.cyr"
output = "build/mabda"

[lib]
entry = "src/mabda.cyr"
modules = [
    "src/error.cyr",
    "src/color.cyr",
    "src/capabilities.cyr",
    "src/profiler.cyr",
    "src/resource.cyr",
    "src/wgpu_types.cyr",
    "src/wgpu_descriptors.cyr",
    "src/wgpu_ffi.cyr",
    "src/context.cyr",
    "src/buffer.cyr",
    "src/typed_buffer.cyr",
    "src/gpu_timestamps.cyr",
    "src/compute.cyr",
    "src/cache_key.cyr",
    "src/shader_cache.cyr",
    "src/pipeline_cache.cyr",
    "src/bind_group_cache.cyr",
    "src/vertex.cyr",
    "src/blend.cyr",
    "src/sampler.cyr",
    "src/depth.cyr",
    "src/bind_group.cyr",
    "src/texture.cyr",
    "src/render_target.cyr",
    "src/render_pipeline.cyr",
    "src/render_pass.cyr",
    "src/surface.cyr",
    "src/instancing.cyr",
    "src/debug.cyr",
]

[deps.sakshi]
git = "https://github.com/MacCracken/sakshi.git"
tag = "0.9.0"
modules = ["sakshi.cyr"]
