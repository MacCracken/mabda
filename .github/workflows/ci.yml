name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Cyrius toolchain
        # The cyrius.cyml `[package].cyrius` pin is the single source of
        # truth for the toolchain version (CLAUDE.md § CI/Release). Use the
        # upstream installer so the versioned ~/.cyrius/versions/<ver>/ layout
        # matches how cyrius resolves the pin. A hand-rolled flat copy into
        # ~/.cyrius/{bin,lib} leaves the pinned version unresolvable and
        # breaks `cyrius deps` (CI failure 2026-06-02; see patra's CI).
        run: |
          set -e
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        # `cyrius deps` reads [deps].stdlib from cyrius.cyml and copies the
        # declared modules from the installed toolchain into `lib/`. Do NOT
        # replace this with a symlink to $HOME/.cyrius/lib or any cyrius
        # checkout — see CLAUDE.md "Dependency wiring" for why.
        run: |
          rm -rf lib
          mkdir lib
          cyrius deps

      - name: Lint
        run: |
          fail=0
          for f in src/*.cyr programs/*.cyr tests/tcyr/*.cyr tests/tcyr/*.tcyr tests/bcyr/*.bcyr fuzz/*.fcyr; do
            out=$(cyrius lint "$f" 2>&1)
            echo "$out"
            if echo "$out" | grep -qE '^\s*warn '; then
              fail=1
            fi
          done
          [ $fail -eq 0 ] || { echo "lint: warnings present"; exit 1; }

      - name: Format check
        run: |
          # cyrius 6.0.x's `cyrfmt --check <file>` reports formatting via the
          # EXIT CODE only (0 = clean, non-zero = needs fmt) — it no longer
          # echoes the formatted file to stdout the way the 5.x toolchain did.
          # The old diff/line-count gate (which compared against that stdout)
          # false-failed every file on 6.0.x. The 5.x 128 KiB fmt-truncation
          # cap is also gone (cyrfmt 6.0.x formats >128 KiB files cleanly —
          # e.g. native.tcyr at ~113 KiB checks clean), so the size guard
          # is retired with it.
          fail=0
          for f in src/*.cyr programs/*.cyr tests/tcyr/*.cyr tests/tcyr/*.tcyr tests/bcyr/*.bcyr fuzz/*.fcyr; do
            if ! cyrius fmt "$f" --check > /dev/null 2>&1; then
              echo "needs fmt: $f"
              fail=1
            fi
          done
          [ $fail -eq 0 ] || { echo "fmt: drift detected"; exit 1; }

      - name: Vet
        run: cyrius vet programs/smoke.cyr

      # Static gate for the compiler's caller-provided scratch buffers. Several
      # pipeline stages memset a full caller-declared capacity into a buffer whose
      # size they cannot see; an undersized one silently overruns the caller's
      # stack. Pure-CPU and hardware-independent, so it runs here even though the
      # native GPU gates cannot.
      - name: Compiler scratch-buffer sizing
        run: ./scripts/check-compiler-buffer-sizing.py

      - name: Verify dist bundle is in sync with src/
        run: |
          cyrius distlib
          if ! git diff --quiet dist/mabda.cyr; then
            echo "ERROR: dist/mabda.cyr is stale. Run 'cyrius distlib' and commit the result."
            git --no-pager diff dist/mabda.cyr | head -40
            exit 1
          fi
          echo "dist/mabda.cyr matches src/"

      - name: Build (link-check, DCE on)
        run: |
          mkdir -p build
          CYRIUS_DCE=1 cyrius build programs/smoke.cyr build/mabda_smoke
          echo "smoke: $(wc -c < build/mabda_smoke) bytes"

      - name: Verify ELF
        run: xxd -l 4 build/mabda_smoke | grep -q "7f45 4c46"

      - name: Test (CPU-only suite)
        run: |
          # Functionality-grouped domain suites (v3.1 test reorg) — globbed
          # so new domain files are picked up automatically.
          for f in tests/tcyr/*.tcyr; do cyrius test "$f" || exit 1; done

      - name: Bench
        run: cyrius bench tests/bcyr/mabda.bcyr

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for dangerous patterns
        # Matches code lines only — rejects patterns in # comments.
        run: |
          FAIL=0
          scan() {
            local label="$1"; shift
            local pat="$1"; shift
            local hits
            hits=$(grep -rn "$pat" src/ programs/ 2>/dev/null | awk -F: '
              { line=$3; for(i=4;i<=NF;i++) line=line":"$i;
                sub(/^[[:space:]]+/,"",line);
                if (substr(line,1,1) != "#") print $1":"$2":"line }')
            if [ -n "$hits" ]; then
              echo "FAIL: $label"
              echo "$hits"
              FAIL=1
            fi
          }
          scan "raw execve"  'syscall( *59'
          scan "raw fork"    'syscall( *57'
          scan "sys_system"  '\bsys_system\s*('
          echo "security scan complete (fail: $FAIL)"
          exit $FAIL

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files
        run: |
          MISSING=0
          for f in README.md CHANGELOG.md VERSION CONTRIBUTING.md SECURITY.md LICENSE cyrius.cyml; do
            if [ -f "$f" ]; then echo "  OK: $f"
            else echo "  MISSING: $f"; MISSING=1; fi
          done
          exit $MISSING

      - name: Verify version consistency
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "VERSION file: $VERSION"
          grep -q "^## \[$VERSION\]" CHANGELOG.md || { echo "FAIL: version not in CHANGELOG.md"; exit 1; }
          echo "Version consistent (manifest pulls VERSION via \${file:VERSION})"
